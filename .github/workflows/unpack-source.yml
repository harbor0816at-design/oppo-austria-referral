name: Import application source

on:
  push:
    branches:
      - main
    paths:
      - source.tar.gz

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand application source
        shell: bash
        run: |
          tar -xzf source.tar.gz
          rm -f source.tar.gz

      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import OPPO Austria Referral V4.2 source [skip ci]"
          git push origin HEAD:main
