name: Import application source

on:
  push:
    branches:
      - main
    paths:
      - 'source.b64.*'

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and expand application source
        shell: bash
        run: |
          cat source.b64.* | base64 -d > source.tar.gz
          tar -xzf source.tar.gz
          rm -f source.tar.gz source.b64.*

      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import OPPO Austria Referral V4.2 source [skip ci]"
          git push origin HEAD:main
